<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dreamstime Auto Submit</title>
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      color: white;
      width: 100%;
      transition: 0.2s;
    }
    #startBtn {
      background-color: #28a745;
    }
    #startBtn:hover {
      background-color: #218838;
    }
    #stopBtn {
      background-color: #dc3545;
      display: none;
    }
    #stopBtn:hover {
      background-color: #c82333;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      background: #e9ecef;
    }
    .status-on {
      color: #28a745;
    }
    .status-off {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <h3>Dreamstime Submit</h3>
  <div id="status" class="status status-off">Status: OFF</div>
  <button id="startBtn">Start Auto Submit</button>
  <button id="stopBtn">Stop Submitting</button>
  <script src="popup.js"></script>
</body>
</html>
