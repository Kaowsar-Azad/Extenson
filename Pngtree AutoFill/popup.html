<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #f8f9fa;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 10px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
  </style>
</head>
<body>
  <h3>Pngtree Auto-Fill</h3>
  <button id="fillBtn">Auto Fill Form</button>
  <div id="closeBtn" style="margin-top: 10px; color: #888; font-size: 12px; cursor: pointer; text-decoration: underline;">Close popup</div>
  <script src="popup.js"></script>
</body>
</html>
